name: Host tools

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  romverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python tooling
        run: python -m compileall -q tools
      - name: Test ROM verifier
        working-directory: tools/romverify
        run: python -m unittest -v test_verify_leafgreen.py
