name: Host tools
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ROM verifier tests
        run: python -m unittest discover -s tools/romverify -p 'test_*.py'
      - name: Asset tool tests
        run: PYTHONPATH=tools/assets python -m unittest discover -s tools/assets -p 'test_*.py'
      - name: Graphics converter tests
        run: PYTHONPATH=tools/gfxconv python -m unittest discover -s tools/gfxconv -p 'test_*.py'
      - name: Validate example manifest
        run: python tools/assets/manifest.py tools/assets/leafgreen_rev1.example.json
      - name: Host overworld test
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude src/overworld/overworld.c tests/host/test_overworld.c -o /tmp/test_overworld && /tmp/test_overworld
      - name: Host script VM test
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude src/script/vm.c tests/host/test_script.c -o /tmp/test_script && /tmp/test_script
      - name: Host LGTR record test
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude src/game/trade_record.c tests/host/test_trade_record.c -o /tmp/test_trade && /tmp/test_trade
      - name: Host save envelope test
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude src/game/save.c tests/host/test_save.c -o /tmp/test_save && /tmp/test_save
      - name: Host resource index test
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude src/game/resource.c tests/host/test_resource.c -o /tmp/test_resource && /tmp/test_resource
      - name: Compile portable modules with warnings as errors
        run: cc -std=c11 -Wall -Wextra -Werror -Iinclude -c src/game/text.c src/game/trade_record.c src/game/save.c src/game/resource.c src/overworld/overworld.c src/script/vm.c
